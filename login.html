<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codyweb.com - Ingresar</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A2647">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">

      <!-- ── VISTA 1: Bienvenida ─────────────────────────── -->
      <div class="login-view" id="viewBienvenida">
        <div class="login-logo">
          <img src="img/escudo.png" alt="Escudo del colegio" onerror="this.style.display='none'">
        </div>
        <h1 class="login-colegio">U.E. Juana Azurduy de Padilla</h1>
        <p class="login-sede">Satélite Norte · Warnes</p>
        <p class="login-app">Sistema de Asistencia Estudiantil</p>

        <button class="btn-login-main" onclick="mostrarVista('login')">Ingresar</button>
      </div>

      <!-- ── VISTA 2: Iniciar sesión ─────────────────────── -->
      <div class="login-view" id="viewLogin" style="display:none;">
        <button class="login-back" onclick="mostrarVista('bienvenida')">‹ Volver</button>
        <div class="login-logo login-logo-sm">
          <img src="img/escudo.png" alt="Escudo del colegio" onerror="this.style.display='none'">
        </div>
        <h2 class="login-titulo">Iniciar sesión</h2>

        <div class="login-msg" id="loginMsg"></div>

        <form id="formLogin" onsubmit="return enviarLogin(event)">
          <div class="login-group">
            <label>Correo electrónico</label>
            <input type="email" id="loginCorreo" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="login-group">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-login-main" id="btnLogin">Entrar</button>
        </form>

        <p class="login-swap">
          ¿No tienes cuenta? <a onclick="mostrarVista('registro')">Regístrate aquí</a>
        </p>
      </div>

      <!-- ── VISTA 3: Registro ───────────────────────────── -->
      <div class="login-view" id="viewRegistro" style="display:none;">
        <button class="login-back" onclick="mostrarVista('login')">‹ Volver</button>
        <div class="login-logo login-logo-sm">
          <img src="img/escudo.png" alt="Escudo del colegio" onerror="this.style.display='none'">
        </div>
        <h2 class="login-titulo">Crear cuenta</h2>

        <div class="login-msg" id="regMsg"></div>

        <form id="formRegistro" onsubmit="return enviarRegistro(event)">
          <div class="login-group">
            <label>Nombre completo</label>
            <input type="text" id="regNombre" placeholder="Ej: Ana Flores" required>
          </div>
          <div class="login-group">
            <label>Correo electrónico</label>
            <input type="email" id="regCorreo" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="login-group">
            <label>Contraseña</label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
          </div>
          <div class="login-group">
            <label>Confirmar contraseña</label>
            <input type="password" id="regPassword2" placeholder="Repite tu contraseña" required>
          </div>
          <button type="submit" class="btn-login-main" id="btnRegistro">Crear cuenta</button>
        </form>

        <p class="login-swap">
          ¿Ya tienes cuenta? <a onclick="mostrarVista('login')">Inicia sesión</a>
        </p>
      </div>

    </div>
    <p class="login-footer">© 2026 Codyweb.com · Sistema de Asistencia Estudiantil</p>
  </div>

  <script>
    // Si ya hay sesión activa, mandar directo al sistema
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    // Registrar Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    function mostrarVista(vista) {
      document.getElementById('viewBienvenida').style.display = vista === 'bienvenida' ? 'block' : 'none';
      document.getElementById('viewLogin').style.display      = vista === 'login'      ? 'block' : 'none';
      document.getElementById('viewRegistro').style.display   = vista === 'registro'   ? 'block' : 'none';
    }

    function mostrarMensaje(id, texto, ok) {
      const el = document.getElementById(id);
      el.textContent = texto;
      el.className = 'login-msg ' + (ok ? 'login-msg-ok' : 'login-msg-error') + ' login-msg-show';
    }

    async function enviarLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Ingresando...';

      const correo = document.getElementById('loginCorreo').value.trim();
      const password = document.getElementById('loginPassword').value;

      const { error } = await sb.auth.signInWithPassword({ email: correo, password });

      if (!error) {
        window.location.href = 'index.html';
      } else {
        const msg = error.message.includes('Invalid login credentials')
          ? 'Correo o contraseña incorrectos'
          : error.message;
        mostrarMensaje('loginMsg', msg, false);
        btn.disabled = false; btn.textContent = 'Entrar';
      }
      return false;
    }

    async function enviarRegistro(e) {
      e.preventDefault();
      const btn = document.getElementById('btnRegistro');

      const nombre    = document.getElementById('regNombre').value.trim();
      const correo    = document.getElementById('regCorreo').value.trim();
      const password  = document.getElementById('regPassword').value;
      const password2 = document.getElementById('regPassword2').value;

      if (password.length < 6) {
        mostrarMensaje('regMsg', 'La contraseña debe tener al menos 6 caracteres', false);
        return false;
      }
      if (password !== password2) {
        mostrarMensaje('regMsg', 'Las contraseñas no coinciden', false);
        return false;
      }

      btn.disabled = true; btn.textContent = 'Creando cuenta...';

      const { error } = await sb.auth.signUp({
        email: correo,
        password,
        options: { data: { nombre } }, // usado por el trigger que crea el perfil
      });

      if (!error) {
        // Si Supabase pide confirmación por correo, avisamos; si no, ya queda logueado
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          window.location.href = 'index.html';
        } else {
          mostrarMensaje('regMsg', '¡Cuenta creada! Revisa tu correo para confirmar tu cuenta.', true);
          btn.disabled = false; btn.textContent = 'Crear cuenta';
        }
      } else {
        mostrarMensaje('regMsg', error.message, false);
        btn.disabled = false; btn.textContent = 'Crear cuenta';
      }
      return false;
    }
  </script>

</body>
</html>
